<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <meta property="og:title" content="pirAs03"/>
        <meta property="og:description" content="Warmup Exercises Generator"/>
        <meta property="og:image" content="https://media.piras03.com/image/asset/previews/warmups.jpg"/>
        <meta property="og:url" content="https://piras03.com/warmups"/>
        <meta property="og:type" content="website"/>

        <title>Warmups - pirAs03</title>

        <style>
            html {
                visibility: hidden;
            }
        </style>

        <script>
            const theme = localStorage.getItem("theme") || "dark";
            document.documentElement.setAttribute("data-theme", theme);
            document.documentElement.style.visibility = "visible";
        </script>
        
        <link rel="stylesheet" href="assets/css/warmups.css">

        <script src="assets/js/navbar.js" defer></script>
        <script src="assets/js/first_time_load.js" defer></script>
        <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js" defer></script>
        <script type="text/javascript" src="../assets/js/purify.js" defer></script>
        <script src="assets/js/warmups.js" defer></script>
    </head>
    <body>
        <nav id="nav">
            <div id="nav-container">
                <div id="nav_left">
                    <a href="index.html">pirAs03</a>
                </div>
                <div id="nav_right">
                    <a href="art.html">Art</a>
                    <a href="blog.html">Blog</a>
                    <a href="warmups.html" class="active">Warmups</a>
                    <button id="toggledarkmode"><img id="dark" src="assets/svg/moon-stars-svgrepo-com.svg"><img id="light" src="assets/svg/sun-svgrepo-com.svg" class="hidden"></button>
                </div>
            </div>
        </nav>
        <article id="main">
            <h1>Warmup Generator</h1>
            <div id="section-0">
                <a id="generator" class="active" href="#">Generator</a>
                <a id="exercises" href="warmups/settings.html">Exercises & Settings</a>
            </div>
            <div id="section-1">
                <h2>The exercise chosen is:</h2>
                <div id="exercise">
                    <div id="title-bar">
                        <h1 id="title"></h1>
                        <span id="group"></span><span id="subgroup"></span>
                    </div>
                    <div id="img-and-buttons">
                        <img src="">
                        <div id="timer-and-score">
                            <div id="timer-block" class="">
                                <h1>Timer</h1>
                                <div id="timer-input" class="">
                                    <input type="number" name="timer-minutes" id="timer-minutes" placeholder="MM" maxlength="2" value="05" min="0" max="60">
                                    <span id="colon">:</span>
                                    <input type="number" name="timer-seconds" id="timer-seconds" placeholder="SS" maxlength="2" value="00" min="0" max="59">
                                </div>
                                <div id="timer" class="hidden">05:00</div>
                                <div id="timer-buttons">
                                    <button id="start">Start</button>
                                    <button id="reset">Reset</button>
                                </div>
                            </div>
                            <div id="score-block" class="hidden">
                                <h1>How did the exercise go?</h1>
                                <div id="score-buttons">
                                    <button id="bad">Bad... (-1)</button>
                                    <button id="okay">Okay (0)</button>
                                    <button id="good">Good! (+1)</button>
                                </div>
                                <div id="checkmark" class="hidden">
                                    That's fine!
                                </div>
                            </div>
                            <button id="skip" class="">Skip exercise</button>
                            <button id="next" class="hidden">Next exercise</button>
                        </div>
                    </div>
                    <div id="instructions-and-goal">
                        <div id="instructions">
                            <h1>Instructions</h1>
                            <div id="instructions-content"></div>
                        </div>
                    </div>
                </div>
            </div>
        </article>
        <footer id="footer">
            <div id="footer-container">
                <h1>Matteo Piras | pirAs03</h1>
                <p>© 2025-2026 All rights reserved.</p>
                <a href="#top">Back to top</a>
            </div>
        </footer>
    </body>
</html>
